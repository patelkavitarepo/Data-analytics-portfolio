name: Case 002 bottleneck investigation
on:
  push:
    paths: ['bottleneck-investigation/**', '.github/workflows/bottleneck-tests.yml']
  pull_request:
    paths: ['bottleneck-investigation/**', '.github/workflows/bottleneck-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: bottleneck-investigation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bottleneck-investigation/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
