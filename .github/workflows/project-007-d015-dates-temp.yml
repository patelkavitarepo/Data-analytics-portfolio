name: Project 007 D015 TEMPORARY timestamp-only source calendar freeze
on:
  push:
    branches: ['feat/007-market-microstructure-research']
    paths:
      - '.github/workflows/project-007-d015-dates-temp.yml'
permissions:
  contents: read
jobs:
  date-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timestamp reader only
        run: python -m pip install 'pyarrow==19.0.1'
      - name: Authenticate publisher and freeze D015 source timestamps only
        working-directory: project-007-market-microstructure
        run: python -u research/freeze_availability_dates_once.py
