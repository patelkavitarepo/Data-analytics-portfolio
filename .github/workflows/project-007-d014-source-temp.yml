name: Project 007 D014 TEMPORARY authenticated adaptive-alert experiment
on:
  push:
    branches: ['feat/007-market-microstructure-research']
    paths:
      - '.github/workflows/project-007-d014-source-temp.yml'
permissions:
  contents: read
jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact sklearn and bounded authenticated Parquet research reader
        run: python -m pip install 'numpy==2.1.3' 'scikit-learn==1.6.1' 'pyarrow==19.0.1'
      - name: Run only frozen D012 fit plus D014 label-free warmup and one-time confirmation
        working-directory: project-007-market-microstructure
        run: python -u research/run_adaptive_alerts_once.py
