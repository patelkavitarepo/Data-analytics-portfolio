name: DataOps Sentinel

on:
  pull_request:
    paths:
      - 'dataops-sentinel/**'
      - '.github/workflows/dataops-sentinel.yml'
  push:
    branches: [main]
    paths:
      - 'dataops-sentinel/**'
      - '.github/workflows/dataops-sentinel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-mvp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dataops-sentinel/requirements*.txt
      - run: python -m pip install -r dataops-sentinel/requirements-dev.txt
      - name: Source checks
        run: |
          python -m ruff check dataops-sentinel
          python -m compileall -q dataops-sentinel
      - name: Tests and Streamlit AppTest smoke
        run: python -m pytest -q dataops-sentinel/tests
      - name: Streamlit imports
        working-directory: dataops-sentinel
        run: python -c "import streamlit; import sentinel.ingestion, sentinel.validation, sentinel.repository, sentinel.reporting"
