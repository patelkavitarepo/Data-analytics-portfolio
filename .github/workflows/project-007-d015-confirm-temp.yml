name: Project 007 D015 TEMPORARY one-time empirical confirmation
on:
  push:
    branches: ['feat/007-market-microstructure-research']
    paths:
      - '.github/workflows/project-007-d015-confirm-temp.yml'
permissions:
  contents: read
jobs:
  empirical-once:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen source and model versions
        run: python -m pip install 'pyarrow==19.0.1' 'numpy==2.2.3' 'scikit-learn==1.6.1'
      - name: One-time original model reconstruction and sealed-final-safe confirmation
        working-directory: project-007-market-microstructure
        run: python -u research/run_availability_alerts_once.py
