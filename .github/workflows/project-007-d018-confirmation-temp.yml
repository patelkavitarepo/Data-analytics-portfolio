name: Project 007 D018 ONE-TIME independent confirmation
on:
  push:
    branches: ['feat/007-market-microstructure-research']
    paths:
      - '.github/workflows/project-007-d018-confirmation-temp.yml'
permissions:
  contents: read
jobs:
  one-time-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen research dependencies
        run: python -m pip install 'pyarrow==19.0.1' 'numpy==2.2.4' 'scikit-learn==1.6.1'
      - name: Execute pre-registered D018 confirmation without sealed-final access
        working-directory: project-007-market-microstructure
        run: python -u research/run_fresh_replication_information_once.py
