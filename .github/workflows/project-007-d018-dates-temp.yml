name: Project 007 D018 TEMPORARY timestamp-only date freeze
on:
  push:
    branches: ['feat/007-market-microstructure-research']
    paths:
      - '.github/workflows/project-007-d018-dates-temp.yml'
permissions:
  contents: read
jobs:
  freeze-once:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timestamp-only parser
        run: python -m pip install 'pyarrow==19.0.1'
      - name: Authenticate pinned source and freeze dates without reading prices
        working-directory: project-007-market-microstructure
        run: python -u research/freeze_fresh_replication_dates_once.py
