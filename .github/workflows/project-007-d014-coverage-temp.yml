name: Project 007 D014 TEMPORARY label-free source coverage postmortem
on:
  push:
    branches: ['feat/007-market-microstructure-research']
    paths:
      - '.github/workflows/project-007-d014-coverage-temp.yml'
permissions:
  contents: read
jobs:
  coverage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only authenticated Parquet dependencies
        run: python -m pip install 'pyarrow==19.0.1'
      - name: Audit original source current and past eligibility WITHOUT ANY TARGET LABELS
        working-directory: project-007-market-microstructure
        run: python -u research/run_adaptive_coverage_postmortem_once.py
