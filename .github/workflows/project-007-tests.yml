name: Project 007 synthetic audit tests

on:
  pull_request:
    paths:
      - 'project-007-market-microstructure/**'
      - '.github/workflows/project-007-tests.yml'
  push:
    branches: ['feat/007-market-microstructure-research']
    paths:
      - 'project-007-market-microstructure/**'
      - '.github/workflows/project-007-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic-only unit tests; never fetch provider data
        working-directory: project-007-market-microstructure
        run: python -m unittest discover -s tests -v

  source-verified-quality-sensitivity-once:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[QA-QUALITY-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed-format Parquet reader for source-only noncommercial analysis
        run: python -m pip install --disable-pip-version-check pyarrow==19.0.1
      - name: Verify same three publisher Parquet members then run frozen gap/flag sensitivity
        run: python project-007-market-microstructure/research/run_quote_quality_sensitivity_once.py
