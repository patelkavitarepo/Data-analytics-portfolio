name: Project 008 synthetic tests

on:
  pull_request:
    paths:
      - 'event-driven-market-intelligence/**'
      - '.github/workflows/project-008-ci.yml'
  push:
    branches:
      - 'research/project-008-*'
    paths:
      - 'event-driven-market-intelligence/**'
      - '.github/workflows/project-008-ci.yml'

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free point-in-time tests
        working-directory: event-driven-market-intelligence
        run: python -m unittest discover -s tests -v
      - name: Prove deterministic offline CLI
        working-directory: event-driven-market-intelligence
        run: |
          python -m market_intel.demo > /tmp/p008-first.json
          python -m market_intel.demo > /tmp/p008-second.json
          cmp /tmp/p008-first.json /tmp/p008-second.json
