# Explicit HEAD diagnosis is separate from locked raw-data processing.
name: Industry companion manual coverage audit
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Synthetic default; head is opt-in headers-only; live stays locked
        type: choice
        default: synthetic
        options: [synthetic, head, live]
      head_only_ack:
        description: Owner requests one HEAD check only (no GET, body read, redirects or retries)
        type: boolean
        default: false
      permission_active:
        description: Owner confirms the dataset-specific grant remains active
        type: boolean
        default: false
      ephemeral_processing_ack:
        description: Owner acknowledges separately reviewed GitHub-hosted processing (not a grant)
        type: boolean
        default: false
      reviewed_code_sha:
        description: For head or live, copy the exact reviewed code SHA from this workflow
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: industry-companion-owner-audit
  cancel-in-progress: false
jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'patelkavitarepo/Data-analytics-portfolio' && github.ref == 'refs/heads/project-006-french-industry-ingestion' && github.actor == 'patelkavitarepo' && github.triggering_actor == 'patelkavitarepo' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: markowitz-industry-companion
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      # Reviewed implementation candidate; hosted permission remains pending.
      REVIEWED_CODE_SHA: 'ce26ac525f95dac4e6a14a23ed4de41746d51da6'
      AUDIT_MODE: ${{ inputs.mode }}
      AUDIT_CODE_SHA_INPUT: ${{ inputs.reviewed_code_sha }}
      HEAD_ONLY_ACK: ${{ inputs.head_only_ack }}
      PERMISSION_ACTIVE_ACK: ${{ inputs.permission_active }}
      EPHEMERAL_PROCESSING_ACK: ${{ inputs.ephemeral_processing_ack }}
      HOSTED_PROCESSING_ENABLED: ${{ vars.FRENCH_INDUSTRY_EPHEMERAL_ENABLED }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: patelkavitarepo/Data-analytics-portfolio
          ref: ${{ env.REVIEWED_CODE_SHA }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python scripts/check_safety.py
      - run: python scripts/check_workflow.py
      - run: |
          ulimit -c 0
          python -m industry_companion.actions_audit --mode "$AUDIT_MODE"
