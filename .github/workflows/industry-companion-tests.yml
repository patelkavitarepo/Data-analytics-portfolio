name: Industry companion synthetic-format tests only
on:
  pull_request:
    paths:
      - 'markowitz-industry-companion/**'
      - '.github/workflows/industry-companion-tests.yml'
      - '.github/workflows/industry-companion-audit.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: markowitz-industry-companion
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python scripts/check_safety.py
      - run: python scripts/check_workflow.py
      - run: python -m industry_companion.actions_audit --mode synthetic
# No source fetch, credentials, raw/private artifacts, performance or publication job.
