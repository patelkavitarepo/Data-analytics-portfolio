name: Project 007 D013 temporary source-authenticated audit
on:
  push:
    branches: [feat/007-market-microstructure-research]
    paths:
      - '.github/workflows/project-007-d013-temporary.yml'
permissions:
  contents: read
jobs:
  one-shot-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source-audit dependencies
        run: python -m pip install 'numpy==2.1.3' 'scikit-learn==1.6.1' 'pyarrow==19.0.1'
      - name: Run D013 one-time source-verified aggregate-only diagnostic
        working-directory: project-007-market-microstructure
        run: python -u research/run_score_stability_audit_once.py
