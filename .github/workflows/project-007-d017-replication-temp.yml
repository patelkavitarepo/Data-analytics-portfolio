name: Project 007 D017 TEMPORARY independent replication
on:
  push:
    branches: ['feat/007-market-microstructure-research']
    paths:
      - '.github/workflows/project-007-d017-replication-temp.yml'
permissions:
  contents: read
jobs:
  replicate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen empirical dependencies
        run: python -m pip install 'pyarrow==19.0.1' 'numpy==2.2.4' 'scikit-learn==1.6.1'
      - name: Reproduce original fit and audit only D017 confirmation
        working-directory: project-007-market-microstructure
        run: python -u research/run_replication_information_once.py
