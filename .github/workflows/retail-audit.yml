name: Retail Intelligence — source audit

on:
  push:
    branches:
      - feat/retail-intelligence-audit
    paths:
      - "retail-intelligence/**"
      - ".github/workflows/retail-audit.yml"
  pull_request:
    paths:
      - "retail-intelligence/**"
      - ".github/workflows/retail-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: retail-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic-data tests
        run: python -m pytest -q
      - name: Audit original UCI workbook
        run: python scripts/audit.py --download
      - name: Investigate negative quantities in original workbook
        run: python scripts/investigate_negative_quantities.py
      - name: Investigate exact duplicate invoice lines
        run: python scripts/investigate_duplicates.py
      - name: Investigate consecutive-invoice near matches
        run: python scripts/investigate_consecutive_invoices.py
      - name: Examine complete invoice contents and local batches
        run: python scripts/investigate_invoice_batches.py
      - name: Measure candidate invoice-run prevalence across both years
        run: python scripts/investigate_population_batches.py
      - name: Reconcile duplicated lines across yearly sheets
        run: python scripts/investigate_sheet_overlap.py
      - name: Build reversible candidate analysis layer and provenance (local only)
        run: python scripts/build_reversible_layer.py
      - name: Compare provisional retail gross-line scenarios
        run: python scripts/investigate_revenue_scenarios.py
      - name: Audit ambiguous Manual stock-code transactions
        run: python scripts/investigate_manual_code.py
      - name: Investigate high-value Manual lines and possible cancellation links
        run: python scripts/investigate_m_linkages.py
      - name: Profile close-time bidirectional Manual sign flips
        run: python scripts/investigate_m_bidirectional.py
      - name: Investigate zero and negative unit-price paradoxes
        run: python scripts/investigate_price_paradox.py
      - name: Investigate mixed zero/positive price invoice context
        run: python scripts/investigate_mixed_price_invoices.py
      - name: Inspect same-invoice zero/paid stock-code patterns
        run: python scripts/investigate_same_sku_price_pairs.py
      - name: Investigate temporal recurrence of zero-price and paid SKU patterns
        run: python scripts/investigate_temporal_zero_paid_sku.py
      - name: Compare multi-unit equal £0 and paid SKU patterns with same-week denominators
        run: python scripts/investigate_multiunit_weekly_context.py
      - name: Validate provisional retail KPI SQL against Case 009 baseline
        run: python scripts/run_sql_kpi_workbench.py
      - name: Publish summary only (not source workbook)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-initial-audit
          path: retail-intelligence/outputs/*.json
          if-no-files-found: warn
